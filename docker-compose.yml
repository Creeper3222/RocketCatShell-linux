services:
  rocketcatshell:
    image: 138763327/rocketcatshell-linux:latest
    pull_policy: always
    container_name: ${ROCKETCAT_CONTAINER_NAME:-rocketcatshell}
    restart: unless-stopped
    ports:
      - "${ROCKETCAT_WEBUI_BIND_IP:-127.0.0.1}:${ROCKETCAT_WEBUI_PORT:-5751}:${ROCKETCAT_WEBUI_PORT:-5751}"
      - "${ROCKETCAT_ONEBOT_HTTP_BIND_IP:-127.0.0.1}:${ROCKETCAT_ONEBOT_HTTP_PORT:-3000}:${ROCKETCAT_ONEBOT_HTTP_PORT:-3000}"
      - "${ROCKETCAT_ONEBOT_WS_BIND_IP:-127.0.0.1}:${ROCKETCAT_ONEBOT_WS_PORT:-3001}:${ROCKETCAT_ONEBOT_WS_PORT:-3001}"
    volumes:
      - type: bind
        source: ${ROCKETCAT_CONFIG_DIR:-/opt/rocketcatshell/config}
        target: /app/config
      - type: bind
        source: ${ROCKETCAT_BOTS_DIR:-/opt/rocketcatshell/data/bots}
        target: /app/data/bots
      - type: bind
        source: ${ROCKETCAT_TEMP_DIR:-/opt/rocketcatshell/data/temp}
        target: /app/data/temp
      - type: bind
        source: ${ROCKETCAT_USER_IDENTITY_DIR:-/opt/rocketcatshell/data/user_identity}
        target: /app/data/user_identity
      - type: bind
        source: ${ROCKETCAT_PLUGINS_DIR:-/opt/rocketcatshell/data/plugins}
        target: /app/data/plugins
      - type: bind
        source: ${ROCKETCAT_PLUGIN_DATA_DIR:-/opt/rocketcatshell/data/plugin_data}
        target: /app/data/plugin_data
      - type: bind
        source: ${ROCKETCAT_LOGS_DIR:-/opt/rocketcatshell/logs}
        target: /app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ROCKETCAT_UPSTREAM_MEDIA_BASE_URL: ${ROCKETCAT_UPSTREAM_MEDIA_BASE_URL:-}
      ROCKETCAT_DOCKER_SERVICE_NAME: ${ROCKETCAT_DOCKER_SERVICE_NAME:-rocketcatshell}
      ROCKETCAT_PERF_TRACE: ${ROCKETCAT_PERF_TRACE:-false}
      ROCKETCAT_WEBUI_HOST: ${ROCKETCAT_WEBUI_HOST:-0.0.0.0}
      ROCKETCAT_WEBUI_PORT: ${ROCKETCAT_WEBUI_PORT:-5751}
      ROCKETCAT_WEBUI_PASSWORD: ${ROCKETCAT_WEBUI_PASSWORD:-123456}
      ROCKETCAT_MESSAGE_INDEX_MAX_ENTRIES: ${ROCKETCAT_MESSAGE_INDEX_MAX_ENTRIES:-1000}
      ROCKETCAT_PERFORMANCE_PROFILE: ${ROCKETCAT_PERFORMANCE_PROFILE:-balanced}
      ROCKETCAT_INBOUND_WORKER_COUNT: ${ROCKETCAT_INBOUND_WORKER_COUNT:-0}
      ROCKETCAT_ONEBOT_OUTGOING_QUEUE_MAX_ENTRIES: ${ROCKETCAT_ONEBOT_OUTGOING_QUEUE_MAX_ENTRIES:-512}
      ROCKETCAT_IDENTITY_CACHE_MAX_ENTRIES: ${ROCKETCAT_IDENTITY_CACHE_MAX_ENTRIES:-4096}
      ROCKETCAT_MEDIA_CACHE_MAX_BYTES: ${ROCKETCAT_MEDIA_CACHE_MAX_BYTES:-1073741824}
      ROCKETCAT_MEDIA_CACHE_MAX_AGE_HOURS: ${ROCKETCAT_MEDIA_CACHE_MAX_AGE_HOURS:-168}
      ROCKETCAT_LOG_FILE_MAX_BYTES: ${ROCKETCAT_LOG_FILE_MAX_BYTES:-10485760}
      ROCKETCAT_LOG_FILE_BACKUP_COUNT: ${ROCKETCAT_LOG_FILE_BACKUP_COUNT:-3}
      ROCKETCAT_TERMINAL_MAX_SESSIONS: ${ROCKETCAT_TERMINAL_MAX_SESSIONS:-6}
      ROCKETCAT_TERMINAL_IDLE_TIMEOUT_SECONDS: ${ROCKETCAT_TERMINAL_IDLE_TIMEOUT_SECONDS:-0}
      ROCKETCAT_LOG_LEVEL: ${ROCKETCAT_LOG_LEVEL:-INFO}
      ROCKETCAT_AUTO_OPEN_BROWSER: ${ROCKETCAT_AUTO_OPEN_BROWSER:-false}
      ROCKETCAT_DEFAULT_ONEBOT_WS_URL: ${ROCKETCAT_DEFAULT_ONEBOT_WS_URL:-ws://host.docker.internal:6200/ws/}
      ROCKETCAT_DEFAULT_ONEBOT_ACCESS_TOKEN: ${ROCKETCAT_DEFAULT_ONEBOT_ACCESS_TOKEN:-}
      ROCKETCAT_DEFAULT_RECONNECT_DELAY: ${ROCKETCAT_DEFAULT_RECONNECT_DELAY:-5.0}
      ROCKETCAT_DEFAULT_MAX_RECONNECT_ATTEMPTS: ${ROCKETCAT_DEFAULT_MAX_RECONNECT_ATTEMPTS:-10}
      ROCKETCAT_DEFAULT_ENABLE_SUBCHANNEL_SESSION_ISOLATION: ${ROCKETCAT_DEFAULT_ENABLE_SUBCHANNEL_SESSION_ISOLATION:-true}
      ROCKETCAT_DEFAULT_REMOTE_MEDIA_MAX_SIZE: ${ROCKETCAT_DEFAULT_REMOTE_MEDIA_MAX_SIZE:-20971520}
      ROCKETCAT_DEFAULT_SKIP_OWN_MESSAGES: ${ROCKETCAT_DEFAULT_SKIP_OWN_MESSAGES:-true}
      ROCKETCAT_DEFAULT_DEBUG: ${ROCKETCAT_DEFAULT_DEBUG:-false}
